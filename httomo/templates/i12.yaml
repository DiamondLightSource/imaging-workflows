apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: httomo-i12
  labels:
    workflows.diamond.ac.uk/science-group-imaging: "true"
  annotations:
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/imaging-workflows"
    workflows.diamond.ac.uk/parameter-schema.input: |
      {
        "type": "string"
      }
    workflows.diamond.ac.uk/parameter-schema.output: |
      {
        "type": "string"
      }
    workflows.diamond.ac.uk/parameter-schema.httomo-outdir-name: |
      {
        "type": "string"
      }
    workflows.diamond.ac.uk/parameter-schema.nprocs: |
      {
        "type": "integer",
        "default": 4
      }
    workflows.diamond.ac.uk/parameter-schema.memory: |
      {
        "type": "string",
        "pattern": "^[0-9]+[GMK]i$",
        "default": "256Gi"
      }
    workflows.diamond.ac.uk/parameter-schema.config: |
      {{- .Files.Get "schemas/i12-tomo.json" | nindent 6 }}
spec:
  entrypoint: run
  arguments:
    parameters:
    - name: visitdir
      valueFrom:
        configMapKeyRef:
          name: sessionspaces
          key: data_directory
  templates:
  - name: run
    inputs:
      parameters:
      - name: config
      - name: input
      - name: output
      - name: httomo-outdir-name
        value: httomo-output
      - name: nprocs
        value: "4"
      - name: memory
        value: 256Gi
    steps:
    - - name: run-httomo
        template: httomo
        arguments:
          parameters:
          - name: config
            value: "{{`{{ inputs.parameters.config }}`}}"
          - name: input
            value: "{{`{{ inputs.parameters.input }}`}}"
          - name: output
            value: "{{`{{ inputs.parameters.output }}`}}"
          - name: nprocs
            value: "{{`{{ inputs.parameters.nprocs }}`}}"
          - name: memory
            value: "{{`{{ inputs.parameters.memory }}`}}"
          - name: httomo-outdir-name
            value: "{{`{{ inputs.parameters.httomo-outdir-name }}`}}"
    - - name: generate-recon-artifact
        template: recon-artifact-script
        arguments:
          parameters:
          - name: nprocs
            value: "{{`{{ inputs.parameters.nprocs }}`}}"
          - name: memory
            value: "{{`{{ inputs.parameters.memory }}`}}"
          - name: output-dir-path
            value: "{{`{{ inputs.parameters.output }}`}}/{{`{{ inputs.parameters.httomo-outdir-name }}`}}"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: nodegroup
      operator: Equal
      value: workflows
      effect: NoSchedule
  - name: httomo
    inputs:
      parameters:
      - name: config
      - name: input
      - name: output
      - name: httomo-outdir-name
      - name: nprocs
      - name: memory
    container:
      image: ghcr.io/diamondlightsource/httomo:latest
      env:
      - name: CUPY_CACHE_DIR
        value: "{{`{{ inputs.parameters.output }}`}}/{{`{{ inputs.parameters.httomo-outdir-name }}`}}/.tmp/cupy/kernel_cache"
      - name: TMPDIR
        value: "{{`{{ inputs.parameters.output }}`}}/{{`{{ inputs.parameters.httomo-outdir-name }}`}}/.tmp"
      - name: MKL_NUM_THREADS
        value: "1"
      - name: NUMEXPR_NUM_THREADS
        value: "1"
      - name: OMP_NUM_THREADS
        value: "1"
      command:
      - /opt/conda/bin/mpirun
      args:
      - "-n"
      - "{{`{{ inputs.parameters.nprocs }}`}}"
      - "/opt/conda/bin/python"
      - "-m"
      - "httomo"
      - "run"
      - "--pipeline-format"
      - "json"
      - "--output-folder-name"
      - "{{`{{ inputs.parameters.httomo-outdir-name }}`}}"
      - "{{`{{ inputs.parameters.input }}`}}"
      - "{{`{{ inputs.parameters.config }}`}}"
      - "{{`{{ inputs.parameters.output }}`}}"
      volumeMounts:
      - name: session
        mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
    volumes:
    - name: session
      hostPath:
        path:  "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory
    podSpecPatch: |
      containers:
      - name: main
        resources:
          requests:
            cpu: "{{`{{ inputs.parameters.nprocs }}`}}"
            memory: "{{`{{ inputs.parameters.memory }}`}}"
            nvidia.com/gpu: "{{`{{ inputs.parameters.nprocs }}`}}"
          limits:
            cpu: "{{`{{ inputs.parameters.nprocs }}`}}"
            memory: "{{`{{ inputs.parameters.memory }}`}}"
            nvidia.com/gpu: "{{`{{ inputs.parameters.nprocs }}`}}"
  - name: recon-artifact-script
    inputs:
      parameters:
      - name: output-dir-path
      - name: nprocs
      - name: memory
      - name: output-filename
        value: multi-page-tiff.tif
    script:
      image: ghcr.io/diamondlightsource/httomo:latest
      command: [/opt/conda/bin/python]
      source: |
        from pathlib import Path
        import h5py
        import tifffile
        import numpy as np

        MAX_SLICES_IN_ARTIFACT = 10
        OUTPUT_FILENAME = "multi-page-tiff.tif"
        RECON_FILENAME_PATTERN = "*.h5"
        OUTPUT_DIR = Path("{{`{{ inputs.parameters.output-dir-path }}`}}")
        recon_file = list(OUTPUT_DIR.glob(RECON_FILENAME_PATTERN))[0]
        OUT_PATH = OUTPUT_DIR / OUTPUT_FILENAME

        with h5py.File(OUTPUT_DIR / recon_file, "r") as f:
            dataset = f["/data"]
            dtype = dataset.dtype
            shape = dataset.shape

            total_no_of_images = shape[1]
            extract_all_slices_into_artifact = total_no_of_images <= MAX_SLICES_IN_ARTIFACT
            extract_no_of_images = (
                total_no_of_images
                if extract_all_slices_into_artifact
                else MAX_SLICES_IN_ARTIFACT
            )

            if extract_all_slices_into_artifact:
                image_stack = np.swapaxes(dataset[:], 0, 1)
            else:
                midpoint = total_no_of_images // 2
                start = midpoint - MAX_SLICES_IN_ARTIFACT // 2
                image_stack = np.swapaxes(
                    dataset[:, start : start + MAX_SLICES_IN_ARTIFACT, :], 0, 1
                )

            tifffile.tifffile.imwrite(OUT_PATH, image_stack)
      volumeMounts:
      - name: session
        mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
    volumes:
    - name: session
      hostPath:
        path:  "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory
    podSpecPatch: |
      containers:
      - name: main
        resources:
          requests:
            cpu: "{{`{{ inputs.parameters.nprocs }}`}}"
            memory: "{{`{{ inputs.parameters.memory }}`}}"
          limits:
            cpu: "{{`{{ inputs.parameters.nprocs }}`}}"
            memory: "{{`{{ inputs.parameters.memory }}`}}"
    outputs:
      artifacts:
      - name: recon
        path: "{{`{{ inputs.parameters.output-dir-path }}`}}/{{`{{ inputs.parameters.output-filename }}`}}"
        archive:
          none: { }
