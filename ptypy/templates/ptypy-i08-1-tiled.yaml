apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ptypy-i08-1-tiled
  labels:
    workflows.diamond.ac.uk/science-group-imaging: "true"
  annotations:
    workflows.argoproj.io/title: PtyPy Reconstruction for I08-1
    workflows.argoproj.io/description: |
      Runs a PtyPy reconstruction job inside a container based on data collected at I08-1.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/imaging-workflows"
    workflows.diamond.ac.uk/parameter-schema: |
      {{- .Files.Get "schema/ptypy_i08-1_nexus_param.json" | nindent 6 }}

spec:
  entrypoint: ptypy-pipeline
  arguments:
    parameters:
    - name: visitdir
      valueFrom:
        configMapKeyRef:
          name: sessionspaces
          key: data_directory
    - name: scanId
      value: "77113"
    - name: outpath
      value: "processing/workflows/ptypy"
    - name: nprocs
      value: "1"
    - name: memory
      value: 100Gi
    - name: usegpu
      value: "true"
    - name: numiter
      value: "100"
    - name: probemodes
      value: "1"
    - name: defocus
      value: "50"
    - name: binning
      value: "2"
  volumeClaimTemplates:
  - metadata:
      name: tmpdir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
      
  templates:
  - name: ptypy-setup
    metadata:
      annotations:
        workflows.diamond.ac.uk/authenticated: "true"
    script:
      image: ghcr.io/bluesky/tiled:latest
      volumeMounts:
      - name: session
        mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
      - name: tmpdir
        mountPath: /tmp
      command: [bash]
      source: |
          echo '{{ .Files.Get "scripts/prepare_config_i08-1.py" | b64enc }}' | base64 -d > /tmp/script.py
          python /tmp/script.py \
          --scan_id \
          --numiter \
          --probe_modes \
          --binning \
          --defocus_microns \
          --use_gpu \
    outputs:
      parameters:
        - name: config
          value: "{{`{{ workflow.parameters.visitdir }}`}}/{{`{{ workflow.parameters.outpath }}`}}/scan_{{`{{ workflow.parameters.scanId }}`}}/ptypy_config.yaml"
    volumes:
    - name: session
      hostPath:
        path: "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory

  - name: get-filepath
    inputs:
      parameters:
      - name: config
    script:
      image: python:3.14
      volumeMounts:
      - name: session
        mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
      - name: tmpdir
        mountPath: /tmp
      command: [python]
      source: |
        import re
        OUTPATH="{{`{{ workflow.parameters.visitdir }}`}}/{{`{{ workflow.parameters.outpath }}`}}"
        SCAN="{{`{{ workflow.parameters.scanId }}`}}"
        CONFIG="{{`{{ inputs.parameters.config }}`}}"
        with open("/tmp/out.txt", "w") as o:
          with open(CONFIG, 'r') as f:
            text = f.read()
            ENGINE = re.findall("    engine0:\n      name: (.*)", text)[0]
            NITER = int(re.findall("      numiter: (.*)", text)[0])
            o.write(f"{OUTPATH}/scan_{SCAN}/{SCAN}_{ENGINE}_{NITER:04d}.ptyr")
    outputs:
      parameters:
      - name: filepath
        valueFrom:
          path: /tmp/out.txt
    volumes:
    - name: session
      hostPath:
        path: "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory
  - name: ptypy-pipeline
    dag:
      tasks:
      - name: prepare
        template: ptypy-setup
      - name: reconstruct-with-gpu
        when: "{{`{{ workflow.parameters.usegpu }}`}} == true" 
        templateRef:
          name: ptypy-generic
          template: ptypy-gpu-run
          clusterScope: true
        depends: "prepare"
        arguments:
          parameters:
          - name: config
            value: "{{`{{ tasks.prepare.outputs.parameters.config }}`}}"
          - name: id
            value: "{{`{{ workflow.parameters.scanId }}`}}"
          - name: outpath
            value: "{{`{{ workflow.parameters.visitdir }}`}}/{{`{{ workflow.parameters.outpath }}`}}"
          - name: nprocs
            value: "{{`{{ workflow.parameters.nprocs }}`}}"
          - name: memory
            value: "{{`{{ workflow.parameters.memory }}`}}"
      - name: reconstruct-with-cpu
        when: "{{`{{ workflow.parameters.usegpu }}`}} == false"
        templateRef:
          name: ptypy-generic
          template: ptypy-cpu-run
          clusterScope: true
        depends: "prepare"
        arguments:
          parameters:
          - name: config
            value: "{{`{{ tasks.prepare.outputs.parameters.config }}`}}"
          - name: id
            value: "{{`{{ workflow.parameters.scanId }}`}}"
          - name: outpath
            value: "{{`{{ workflow.parameters.visitdir }}`}}/{{`{{ workflow.parameters.outpath }}`}}"
          - name: nprocs
            value: "{{`{{ workflow.parameters.nprocs }}`}}"
          - name: memory
            value: "{{`{{ workflow.parameters.memory }}`}}"
      - name: get-filepath
        template: get-filepath
        depends: "reconstruct-with-gpu || reconstruct-with-cpu"
        arguments:
          parameters:
          - name: config
            value: "{{`{{ tasks.prepare.outputs.parameters.config }}`}}"
      - name: plot
        templateRef:
          name: ptypy-utils
          template: ptypy-plotting
          clusterScope: true
        depends: "get-filepath"
        arguments:
          parameters:
          - name: filepath
            value: "{{`{{tasks.get-filepath.outputs.parameters.filepath}}`}}"
